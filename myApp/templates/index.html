<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Under Construction — LawlerAI™</title>
<meta name="description" content="LawlerAI™ — our site is under construction. Pardon our dust.">
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --ink:  #0B0D0E;
    --bone: #F4F1EC;
    --dim:  rgba(244, 241, 236, 0.60);
    --line: rgba(244, 241, 236, 0.14);
  }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(2rem, 8vw, 4rem) clamp(1.25rem, 6vw, 3rem);
    background: var(--ink);
    color: var(--bone);
    font-family: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  img { max-width: 100%; height: auto; display: block; }

  .logo {
    width: clamp(140px, 40vw, 190px);
    margin: 0 auto clamp(2rem, 7vw, 3rem);
  }

  h1 {
    font-size: clamp(1.9rem, 8vw, 3.4rem);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    margin: 0 0 1rem;
  }

  p {
    font-size: clamp(1rem, 3vw, 1.15rem);
    color: var(--dim);
    max-width: 46ch;
    margin: 0 auto;
  }

  .divider {
    width: 60px;
    height: 2px;
    background: var(--line);
    margin: clamp(2rem, 7vw, 2.75rem) auto;
  }

  .contact {
    font-size: 0.95rem;
    color: var(--dim);
  }
  .contact a {
    color: var(--bone);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2px;
  }
  .contact a:hover { border-color: var(--bone); }

  footer {
    margin-top: clamp(3rem, 10vw, 5rem);
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(244, 241, 236, 0.35);
  }
</style>
</head>
<body>

  <img class="logo" src="https://cdn.katalyst-crm.com/t1/cloudinary/lawker_AI_Logo_jyfkkp.png"
       alt="LawlerAI™" width="190" height="47">

  <h1>Under Construction</h1>
  <p>Pardon our dust — we're making some improvements. Please check back soon.</p>

  <div class="divider"></div>

  <p class="contact">
    Need something in the meantime?<br>
    <a href="mailto:hello@lawlerai.com">hello@lawlerai.com</a>
  </p>

  <footer>Strategic AI Risk &amp; Control for Sports Organizations</footer>

</body>
</html>
